<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College IT Support | لقاء تعريفي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#0F1A18; --gold:#C8A24A; --sand:#F4EEE1; --line:rgba(244,238,225,.14); --muted:rgba(244,238,225,.55); }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'IBM Plex Sans Arabic', sans-serif;
    background:#000;
    color:var(--sand);
    min-height:100vh;
  }
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:20px 32px; }
  .back-link{
    color:var(--sand); text-decoration:none; font-size:14px; font-weight:500;
    display:inline-flex; align-items:center; gap:8px;
    background:rgba(244,238,225,.06); border:1.5px solid var(--line); border-radius:20px;
    padding:8px 16px; transition:border-color .15s ease, background .15s ease;
  }
  .back-link svg{ width:16px; height:16px; flex-shrink:0; }
  .back-link:hover{ border-color:var(--gold); background:rgba(244,238,225,.1); }

  .home-link{
    color:var(--sand); text-decoration:none;
    width:38px; height:38px; border-radius:50%;
    background:rgba(244,238,225,.06); border:1.5px solid var(--line);
    display:inline-flex; align-items:center; justify-content:center;
    transition:border-color .15s ease, background .15s ease;
  }
  .home-link svg{ width:18px; height:18px; }
  .home-link:hover{ border-color:var(--gold); background:rgba(244,238,225,.1); }

  .content{ max-width:1200px; margin:0 auto; padding:20px 32px 60px; }
  .content h1{ font-family:'Tajawal', sans-serif; font-weight:900; font-size:24px; margin-bottom:6px; color:var(--sand); }
  .content .sub{ color:var(--muted); font-size:14px; margin-bottom:28px; }

  .video-wrap{
    background:#000; border-radius:12px; overflow:hidden;
    border:1.5px solid var(--line);
  }
  .video-wrap video{ width:100%; display:block; max-height:80vh; }

  /* ===== Entrance motion ===== */
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  .topbar{ animation:fadeUp .5s ease both; }
  .content h1{ animation:fadeUp .55s ease .08s both; }
  .content .sub{ animation:fadeIn .5s ease .16s both; }
  .video-wrap{ animation:fadeUp .55s ease .22s both; }
  @media (prefers-reduced-motion: reduce){
    .topbar, .content h1, .content .sub, .video-wrap{ animation:none !important; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <a class="back-link" href="{{ url_for('about_college') }}"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 11L12 4L20 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10V19C6 19.5523 6.44772 20 7 20H10V15C10 14.4477 10.4477 14 11 14H13C13.5523 14 14 14.4477 14 15V20H17C17.5523 20 18 19.5523 18 19V10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>رجوع لصفحة عن الكلية</a>
    <a class="home-link" href="{{ url_for('dashboard') }}" title="الرئيسية"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 11L12 3L21 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10V20C5 20.5523 5.44772 21 6 21H9V15C9 14.4477 9.44772 14 10 14H14C14.5523 14 15 14.4477 15 15V21H18C18.5523 21 19 20.5523 19 20V10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  </div>

  <main class="content">
    <h1>لقاء تعريفي</h1>
    <p class="sub">لقاء تعريفي شامل يقدّم لمحة عن الكلية وأقسامها ومرافقها</p>

    <div class="video-wrap">
      <video controls preload="metadata" src="{{ url_for('static', filename='videos/intro-meeting.mp4') }}"></video>
    </div>
  </main>

</body>
</html>
